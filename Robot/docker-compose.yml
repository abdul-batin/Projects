version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./Server:/app/Server
      - ./algorithm:/app/algorithm
    environment:
      - DATABASE_URL=sqlite:////app/data/robot_planner.db
    restart: unless-stopped
    
